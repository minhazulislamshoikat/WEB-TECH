<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Advanced User Form</title>
</head>
<body>

<h2 align="center">Advanced User Form</h2>

<form>

<fieldset>
    <legend>Personal Information</legend>

    <label>Name:</label>
    <input type="text" size="17">

    <label>Gender:</label>
    <input type="radio" name="gender" value="male">Male
    <input type="radio" name="gender" value="female">Female

    <br>

    <label>Email:</label>
    <input type="email" size="17">

    <label>DOB:</label>
    <input type="date">
</fieldset>

<br>

<fieldset>
    <legend>Account Details</legend>

    <label>Username:</label>
    <input type="text" size="18">

    <label>Password:</label>
    <input type="password" size="18">

    <br>

    <label>Security Question:</label>
    <select>
        <option>Select Question</option>
        <option>What is your favorite color?</option>
        <option>What is your pet's name?</option>
        <option>What is your birthplace?</option>
    </select>

    <label>Answer:</label>
    <input type="text" size="18">
</fieldset>

<br>

<fieldset>
    <legend>Address Information</legend>

    <label>Country:</label>
    <select>
        <option>Bangladesh</option>
        <option>India</option>
        <option>Pakistan</option>
        <option>Nepal</option>
    </select>

    <label>City:</label>
    <input type="text" size="18">

    <br><br>

    <label>Address:</label>
    <textarea rows="2" cols="26"></textarea>
</fieldset>

<br>

<fieldset>
    <legend>Education &amp; Employment</legend>

    <label>Degree:</label>
    <select>
        <option>Bachelor</option>
        <option>Master</option>
        <option>Diploma</option>
        <option>PhD</option>
    </select>

    <label>Status:</label>
    <select>
        <option>Student</option>
        <option>Employed</option>
        <option>Unemployed</option>
    </select>

    <br>

    <label>Institute:</label>
    <input type="text" size="18">

    <label>Passing Year:</label>
    <input type="text" size="18">
</fieldset>

<br>

<fieldset>
    <legend>Additional Information</legend>

    <label>Interest:</label>
    <select multiple size="3">
        <option>Technology</option>
        <option>Sports</option>
        <option>Music</option>
    </select>

    <label>Skill:</label>
    <input type="range" min="0" max="100" value="50">

    <br>

    <label>Website:</label>
    <input type="url" size="18">
</fieldset>

<br>

<fieldset>
    <legend>Documents &amp; Payment</legend>

    <label>Profile Photo:</label>
    <input type="file">

    <label>Payment:</label>
    <select>
        <option>Credit Card</option>
        <option>Debit Card</option>
        <option>Cash</option>
    </select>

    <br>

    <label>Card Number:</label>
    <input type="text" size="18">
</fieldset>

<br>

<fieldset>
    <legend>Emergency &amp; Agreement</legend>

    <label>Contact Name:</label>
    <input type="text" size="18">

    <label>Phone:</label>
    <input type="tel" size="18">

    <br>

    <input type="checkbox">
    <label>I agree to terms and conditions</label>

    <input type="checkbox">
    <label>Subscribe newsletter</label>
</fieldset>

<br>

<div align="center">
    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
</div>

</form>

</body>
</html>
